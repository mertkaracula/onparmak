<title>On Parmak F Klavye</title>
<style id="gs">
html,body{margin:0;min-height:100%}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F2F5F8;color:#14202B;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box;-webkit-text-size-adjust:100%}
@media (prefers-color-scheme:dark){body{background:#0D1319;color:#E7EEF4}#gate input{background:#151E27;color:#E7EEF4;border-color:#2A3743}#gate p{color:#9BA9B6}#gate .go{background:#6CC4DE;color:#06222C}}
#gate{width:min(100%,360px);display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
#gate h1{margin:0;font:600 30px/1.1 Georgia,"Times New Roman",serif}
#gate p{margin:0;color:#586674;font-size:15px}
#gate form{display:flex;flex-direction:column;gap:10px}
#gate input[type=password],#gate input[type=text]{font:500 17px system-ui,sans-serif;padding:12px 14px;border-radius:10px;border:1px solid #D3DAE1;background:#fff;color:#14202B;width:100%;box-sizing:border-box}
#gate .go{font:600 16px system-ui,sans-serif;padding:12px;border-radius:10px;border:0;background:#0E5A73;color:#fff;cursor:pointer}
#gate .go[disabled]{opacity:.55;cursor:default}
#gate label{display:flex;gap:8px;align-items:center;font-size:14px}
#gate .err{color:#C23B2B;min-height:1.4em;font-size:14px}
@media (prefers-color-scheme:dark){#gate .err{color:#FF7F6E}}
</style>
<main id="gate">
  <h1>On Parmak</h1>
  <p>Devam etmek için şifreyi girin.</p>
  <form id="gf" autocomplete="on">
    <input type="password" id="pw" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Şifre" aria-label="Şifre" required>
    <label><input type="checkbox" id="sh"> Şifreyi göster</label>
    <label><input type="checkbox" id="rm" checked> Bu cihazda hatırla</label>
    <button class="go" id="go" type="submit">Aç</button>
    <div class="err" id="er" role="alert"></div>
  </form>
</main>

var $=function(i){return document.getElementById(i)};
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function tob64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
var LS={g:function(k){try{return localStorage.getItem(k)}catch(e){return null}},s:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},d:function(k){try{localStorage.removeItem(k)}catch(e){}}};
async function dec(key){var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.n)},key,b64(D.c));return new TextDecoder().decode(pt)}
function launch(html){
  var t=document.createElement("template");t.innerHTML=html;
  var gs=$("gs");if(gs)gs.remove();
  var me=document.currentScript;
  document.body.innerHTML="";document.body.removeAttribute("style");
  var ns=Array.prototype.slice.call(t.content.childNodes);
  for(var i=0;i<ns.length;i++){
    var n=ns[i];
    if(n.nodeName==="SCRIPT"){var s=document.createElement("script");s.textContent=n.textContent;document.body.appendChild(s)}
    else if(n.nodeName==="TITLE"){document.title=n.textContent}
    else document.body.appendChild(n);
  }
  setTimeout(function(){
    if(!window.__opReady){var d=document.createElement("div");d.style.cssText="padding:24px;font:16px system-ui,sans-serif;color:#C23B2B";d.textContent="Uygulama başlatılamadı. Sayfayı yenileyin, sorun sürerse bildirin.";document.body.insertBefore(d,document.body.firstChild)}
  },3000);
}
var fails=0,busy=false;
async function tryStored(){
  var k=LS.g("onparmak.k");if(!k)return false;
  try{
    var key=await crypto.subtle.importKey("raw",b64(k),{name:"AES-GCM"},false,["decrypt"]);
    launch(await dec(key));return true;
  }catch(e){LS.d("onparmak.k");return false}
}
async function submit(e){
  e.preventDefault();if(busy)return;
  var pw=$("pw").value.trim(),er=$("er"),go=$("go");
  if(!pw)return;
  busy=true;go.disabled=true;er.textContent="";
  try{
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.s),iterations:D.i,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
    var html=await dec(key);
    if($("rm").checked){var raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));LS.s("onparmak.k",tob64(raw))}
    launch(html);return;
  }catch(x){
    fails++;var wait=Math.min(30,Math.pow(2,fails-1));
    er.textContent="Şifre yanlış."+(fails>1?" "+wait+" saniye bekleyin.":"");
    $("pw").value="";
    go.disabled=true;setTimeout(function(){go.disabled=false;busy=false},wait*1000);return;
  }
}
async function start(){
  if(!(window.crypto&&crypto.subtle)){$("er").textContent="Bu tarayıcı güvenli bağlantı olmadan şifre çözemiyor. Sayfayı https adresinden açın.";$("go").disabled=true;return}
  if(await tryStored())return;
  $("gf").addEventListener("submit",submit);
  $("sh").addEventListener("change",function(){$("pw").type=this.checked?"text":"password"});
  $("pw").focus();
}
start();
})();
